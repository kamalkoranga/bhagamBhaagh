[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "geoalchemy2>=0.20.0",
    "psycopg2-binary>=2.9.13",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
ignore = ["B008"]
